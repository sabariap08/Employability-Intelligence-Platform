<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Employability Intelligence Platform</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
	<div class="login-wrap">
	<h1>Employability Intelligence Platform</h1>
	<form>
		<div style="display: flex;">
			<p>Username(Email) :</p>
			<input type="email" name="mail" placeholder="Enter your Email Here" autocomplete="username">
		</div>
		<div style="display: flex;">
			<p>Password :</p>
			<input type="password" name="pass" placeholder="Enter your Password Here" autocomplete="current-password">
		</div>
		<div style="display: flex;">
			<input type="submit" name="login" value="Login">
			<a href="#">Forgot Password !</a>
		</div>
	</form>
	</div>
</body>
</html>
